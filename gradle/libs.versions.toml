# This catalog gives only the versions that Spring Boot dependency management does not manage.
# build.gradle.kts declares the other dependencies without versions, so Spring Boot keeps them consistent.

[versions]
kotlin = "2.3.21"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
springdoc = "3.1.0"
jte = "3.2.4"
jgit = "7.8.0.202609011348-r"
# Apache sshd uses this provider for Ed25519 keys in Git SSH. Folio's own crypto uses only the JDK.
bouncycastle = "1.86"
# Folio uses only this Google library, for Application Default Credentials. It calls the Cloud Identity API with
# RestClient, so it needs no Google API client.
googleAuth = "1.54.0"
# The version of datasource-micrometer must match Spring Boot: version 2.3 is for Spring Boot 4.1.
datasourceMicrometer = "2.3.0"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
# A pre-release, because detekt 1.23.x does not support Kotlin 2.3. Move to 2.0.0 when it is final.
detekt = "2.0.0-alpha.6"
# The Kotlin version that detekt was compiled with, from the detekt-core POM. Update it together with detekt.
detektKotlin = "2.4.10"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
# The OpenAPI document only. Folio serves no Swagger UI, because it needs inline styles and the UI content security
# policy blocks them.
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
jte-kotlin = { module = "gg.jte:jte-kotlin", version.ref = "jte" }
jte-spring-boot-starter = { module = "gg.jte:jte-spring-boot-starter-4", version.ref = "jte" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
jgit-ssh-apache = { module = "org.eclipse.jgit:org.eclipse.jgit.ssh.apache", version.ref = "jgit" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
google-auth = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuth" }
datasource-micrometer-spring-boot = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasourceMicrometer" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
jte = { id = "gg.jte.gradle", version.ref = "jte" }
