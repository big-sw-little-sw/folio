# Test settings on top of src/main/resources/application.yaml. Boot also reads classpath:/config/, so this
# file adds to the main one instead of hiding it.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests authenticate with Spring Security's jwt() request post-processor.
          issuer-uri: https://issuer.test
          audiences: folio-test
management:
  server:
    # The application's port, so that MockMvc reaches the actuator; ManagementPortIntegrationTest covers a port of its
    # own, as deployed.
    port: 8080
folio:
  super-admins:
    - user:super-admin
  crypto:
    # Test-only secrets. Version 1 lets tests create keys under an older version and re-encrypt them.
    master-keys:
      1: GcMeb3J13AAREi3DzgyshZL/FL08vOuyK77HkB095U4=
      2: uv8GMrwyjtZpqi4eruxcrHoo+hdO74ZX+uLGen3rDio=
    active-key-version: 2
  sync:
    # Tests drive sync directly; the scheduled poll and cache sweep must not run during a test run. Test contexts share
    # one cache directory but not their databases, so a sweep would remove other contexts' repositories.
    poll-interval: 1h
    interval: 1h
    max-backoff: 8h
  # Not turned off: the daily audit prune still runs 10 minutes after a test context starts. It deletes only records
  # older than folio.audit.retention, which tests write only on purpose, so it is harmless to them.
  git:
    # cache-directory: set per test run by build.gradle.kts.
    instances:
      # Placeholders: no test connects to these instances.
      example:
        host: git.example.test
        host-keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINdamAGCsQq31Uv+08lkBzoO4XLz2qYjJa8CGmj3B1Ea
      other:
        host: git.other.test
        host-keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINdamAGCsQq31Uv+08lkBzoO4XLz2qYjJa8CGmj3B1Ea
