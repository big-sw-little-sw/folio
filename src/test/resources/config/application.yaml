# Test settings on top of src/main/resources/application.yaml. Boot also reads classpath:/config/, so this
# file adds to the main one instead of hiding it.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests authenticate with Spring Security's jwt() request post-processor.
          issuer-uri: https://issuer.test
          audiences: folio-test
folio:
  bootstrap:
    admins:
      - user:bootstrap-admin
  crypto:
    # Test-only secrets. Version 1 lets tests create keys under an older version and re-encrypt them.
    master-keys:
      1: GcMeb3J13AAREi3DzgyshZL/FL08vOuyK77HkB095U4=
      2: uv8GMrwyjtZpqi4eruxcrHoo+hdO74ZX+uLGen3rDio=
    active-key-version: 2
  git:
    # cache-directory: set per test run by build.gradle.kts.
    instances:
      example:
        host: git.example.test
        # A placeholder: no test connects to this instance.
        host-keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINdamAGCsQq31Uv+08lkBzoO4XLz2qYjJa8CGmj3B1Ea
