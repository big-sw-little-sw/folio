# This file adds test settings to src/main/resources/application.yaml. Spring Boot reads both files, and the values in
# classpath:/config/ take precedence. bootTestRun also reads this file.
server:
  servlet:
    session:
      cookie:
        # Tests and local runs use http://localhost. java.net.CookieManager and some browsers ignore a Secure cookie on
        # plain HTTP, so the session would not work.
        secure: false
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # This value is a placeholder. Spring Boot creates the JWT decoder only if this property exists before the
          # context starts. TestIssuerConfiguration (tests) and MockOidcProviderConfiguration (bootTestRun) replace the
          # value.
          issuer-uri: http://issuer.invalid
          audiences: folio
      client:
        registration:
          folio:
            client-id: folio-ui
            client-secret: local-secret
            scope: openid
        provider:
          folio:
            # This value is also a placeholder. The same test configurations replace it.
            issuer-uri: http://issuer.invalid
folio:
  # In tests and local runs, a caller with the group folio-admins is a super admin. To sign in as a super admin with
  # bootTestRun, give the claims {"groups": ["folio-admins"]}.
  super-admins:
    - group:folio-admins
