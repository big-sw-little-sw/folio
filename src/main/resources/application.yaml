spring:
  application:
    name: folio
  mvc:
    # Framework errors (malformed JSON, type mismatches) get RFC 9457 bodies like ProblemDetailsAdvice gives.
    problemdetails:
      enabled: true
logging:
  level:
    # JGit and Apache sshd log exceptions whose messages can quote server output; Folio logs only failure codes
    # instead (ADR 0027). Turning these on for debugging can write Git transport output to the logs.
    org.apache.sshd: off
    org.eclipse.jgit: off
# Deployments set (ADR 0002):
# - spring.security.oauth2.resourceserver.jwt.issuer-uri: the one trusted issuer.
# - spring.security.oauth2.resourceserver.jwt.audiences: required; startup fails without it. Tokens whose
#   `aud` does not contain one of these values are rejected.
# - folio.security.claims and folio.super-admins. Use separate client registrations for workloads; `application:`
#   subjects match any token whose application claim has that value, including user tokens issued through the same
#   client.
# - folio.crypto.master-keys and folio.crypto.active-key-version: required; startup fails without them (ADR 0019).
#   Each positive version maps to a base64 secret of at least 32 bytes, for example `openssl rand -base64 32`.
#   Supply them through the deployment's secret mechanism, never in this file or the database.
# - folio.git.instances: the Git service instances credentials belong to, by name (ADR 0016), for example
#   `github: {host: github.com, host-keys: ["ssh-ed25519 AAAA…"]}`. The port defaults to 22 and the SSH user to
#   `git`. host-keys lists the trusted host keys as OpenSSH public key lines, at least one; they are the only keys
#   Folio accepts from the server (ADR 0025). Take them from the provider's published fingerprints, not from a
#   first connection.
# - folio.git.cache-directory: required; an absolute directory for the disposable repository cache (ADR 0024).
#   Each instance has its own.
# - folio.git.fetch-deadline: how long one fetch may take, default 5m (ADR 0033).
# - folio.git.max-repository-size: the most a ConfigSet's cached repository may hold on disk, default 1GB (ADR 0033).
# - folio.sync (ADR 0032), all optional: interval (default 1m) between syncs of a ConfigSet; max-backoff (default 30m)
#   caps the doubling of that interval after consecutive failures; poll-interval (default 10s) between polls for due
#   ConfigSets; max-concurrent-fetches (default 4) per instance.
