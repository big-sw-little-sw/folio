spring:
  application:
    name: folio
  threads:
    virtual:
      # Requests, scheduled tasks and async work run on virtual threads. Git and database calls block, and virtual
      # threads make blocking calls cheap.
      enabled: true
  session:
    jdbc:
      # Flyway creates the session tables in V1__spring_session.sql. Spring Session must not create them again.
      initialize-schema: never
  # Deployments set the identity provider:
  #   security.oauth2.resourceserver.jwt.issuer-uri: the one trusted issuer. Folio does not start without it.
  #   security.oauth2.resourceserver.jwt.audiences: Folio's audiences. Folio does not start without them.
  #   security.oauth2.client.registration.folio: client-id, client-secret and scope (openid and more) of the web UI
  #     client. Its redirect URI is https://<folio-host>/login/oauth2/code/folio.
  #   security.oauth2.client.provider.folio.issuer-uri: the same issuer. Folio does not start if the two differ.
server:
  # Each deployment puts Folio behind a TLS proxy on an internal address. The proxy sets X-Forwarded-Proto and
  # X-Forwarded-Host. Tomcat trusts these headers only from internal addresses. Sign-in then uses an https redirect URI.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # The browser sends the session cookie only over HTTPS.
        secure: true
gg:
  jte:
    template-suffix: .kte
springdoc:
  # The OpenAPI document describes the API only, not the UI routes.
  paths-to-match: /api/**
management:
  server:
    # The actuator has its own port, and the application port never serves it. Keep the management port off public
    # networks, because health and prometheus need no token. Probes use the management port.
    port: 8081
  endpoints:
    web:
      exposure:
        # Folio exposes only these endpoints. Other endpoints, such as env and configprops, show configuration values.
        include: health, prometheus
# Folio has these settings of its own. The default of each setting is in parentheses.
#   folio.security.claims.subject (sub), .groups (groups) and .application-id (azp) name the claims that give the
#     caller.
#   folio.security.directory (token) selects the directory, which gives the groups of a caller.
#   folio.ui.session-timeout (1h) is the time without use after which a UI session ends.
#   folio.audit.retention (90d) is the age at which Folio deletes an audit record. Each instance deletes old records
#     one time each day.
#   folio.super-admins (none) lists the subjects of the super admins, for example group:<id>. Each entry is a user:,
#     group: or application: subject. Keep the list small. Without super admins, nobody can create a top-level
#     Namespace. A UI session keeps its super-admin status until the next sign-in.
#   folio.crypto.master-keys (none) maps a positive integer version to a base64 master secret of 32 bytes or more,
#     for example 1: <secret>. Keep the secrets in a secret store. Folio does not start without a secret.
#   folio.crypto.active-key-version (none) names the version that encrypts new keys. Folio does not start if the
#     version is not in folio.crypto.master-keys, or if a stored key uses a version that is not there.
#   folio.content.max-file-size (100MB) is the largest ConfigItem that Folio serves. Folio refuses a larger item with
#     status 422. Folio streams files, so this limit protects bandwidth, not memory.
#   folio.content.latest-max-age (30s) is how long caches keep responses for latest, metadata and revision lists. It
#     is also how long shared caches keep a public exact revision before they revalidate it. Zero makes caches
#     revalidate each time.
